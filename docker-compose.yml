# Local development — SQL Server 2022, the closest engine to Azure SQL, and Azurite,
# the storage emulator standing in for the public media account.
#
#   docker compose up -d       start (data survives restarts via the named volumes)
#   docker compose down        stop, keep the data
#   docker compose down -v     stop and wipe the data, both volumes
#
# MSSQL_SA_PASSWORD comes from .env — see .env.example. Note that SQL Server only
# applies it when it initialises an empty data directory: changing the password in
# .env against an existing volume yields "Login failed for user 'sa'" and a container
# stuck unhealthy. Recreate the volume (`docker compose down -v`) to pick up a new one.
#
# Cloud environments never use SQL authentication: Azure SQL is Entra-only and the
# API connects with a managed identity. This container is the sole exception.

# Pinned so the project — and therefore the volume name — does not depend on the
# directory the repository happens to be cloned into.
name: lehub

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lehub-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env — see .env.example}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - lehub-sql-data:/var/opt/mssql
    healthcheck:
      # $$ escapes Compose interpolation so the container's own shell expands the
      # variable — the password is never baked into the resolved config, and a
      # password containing quotes or $ cannot break the command.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' > /dev/null 2>&1",
        ]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

  azurite:
    # Pinned, unlike the SQL image whose 2022-latest tag still fixes the engine major:
    # Azurite publishes no such tag, and `latest` would let a major land in the local
    # loop with no diff to bisect.
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    container_name: lehub-azurite
    # Blob only. No function declares a storage trigger and AzureWebJobsStorage stays
    # empty, so the queue and table endpoints would listen for nobody; publishing the
    # single blob port also halves the surface that can collide with something else.
    #
    # The emulator's well-known account is the local counterpart of the media storage
    # account, which sets allowSharedKeyAccess: false — shared key exists here and
    # nowhere else, exactly as SQL authentication does above. Nothing configures it:
    # the scripts connect with the conventional UseDevelopmentStorage=true shortcut,
    # so no key is written into a versioned file.
    #
    # --skipApiVersionCheck keeps the emulator from rejecting an x-ms-version newer
    # than the image knows, which is what an SDK upgrade would otherwise produce.
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - lehub-azurite-data:/data
    healthcheck:
      # Azurite binds the port only once it is ready to serve, and busybox nc is the
      # only probe the image ships — it has no curl and no wget spider worth trusting
      # against a 403 on an unauthenticated request.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 10s
      retries: 10
      start_period: 5s
      timeout: 5s

volumes:
  lehub-sql-data:
  lehub-azurite-data:
