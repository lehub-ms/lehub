<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Placeholder banner">
  <title>Placeholder banner — dot grid</title>
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#005fb8"/>
    </linearGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="6" fill="#4d9fde" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="480" fill="url(#g)"/>
  <rect width="1200" height="480" fill="url(#dots)"/>
  <rect x="640" y="96" width="288" height="288" rx="48" fill="#e6f0fa" opacity="0.16"/>
</svg>
