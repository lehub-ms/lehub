name: CD

# The deployment pipeline, parameterised by environment and owning no trigger
# of its own. cd-dev.yml calls it for dev on every merge to develop; opening
# prod one day is a new ten-line caller plus its identity bootstrap — a
# configuration to add, not a workflow to rewrite.
#
# Job order is the order the architecture imposes: resources first, then the
# database schema, then the API, then the two web apps — which need the
# Function App's public URL at build time.
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prod)
        required: true
        type: string

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    # The GitHub environment carries the AZURE_* variables and is what the
    # federated credential's subject points at: no environment, no token.
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      functionAppName: ${{ steps.deploy.outputs.functionAppName }}
      functionAppHostname: ${{ steps.deploy.outputs.functionAppHostname }}
      apiBaseUrl: ${{ steps.deploy.outputs.apiBaseUrl }}
      webAppName: ${{ steps.deploy.outputs.webAppName }}
      webAppHostname: ${{ steps.deploy.outputs.webAppHostname }}
      adminAppName: ${{ steps.deploy.outputs.adminAppName }}
      adminAppHostname: ${{ steps.deploy.outputs.adminAppHostname }}
      sqlServerName: ${{ steps.deploy.outputs.sqlServerName }}
      sqlServerFqdn: ${{ steps.deploy.outputs.sqlServerFqdn }}
      sqlDatabaseName: ${{ steps.deploy.outputs.sqlDatabaseName }}
      mediaHostname: ${{ steps.deploy.outputs.mediaHostname }}
      entraTenantId: ${{ steps.deploy.outputs.entraTenantId }}
      entraClientId: ${{ steps.deploy.outputs.entraClientId }}
      entraAuthority: ${{ steps.deploy.outputs.entraAuthority }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infra/main.bicep
        id: deploy
        # Named after the run so the portal's deployment history links back to
        # the GitHub execution that produced it. The resource group is a
        # prerequisite created by hand — see docs/deployment.md.
        run: |
          outputs=$(az deployment group create \
            --resource-group "rg-lehub-${{ inputs.environment }}" \
            --name "lehub-${{ github.run_id }}" \
            --template-file infra/main.bicep \
            --parameters "infra/main.${{ inputs.environment }}.bicepparam" \
            --query properties.outputs --output json)
          # Every downstream job consumes resource names from here — never a
          # hard-coded name in any workflow. Assign before appending: a
          # failed substitution in an echo argument would not fail the step,
          # a failed assignment does.
          for key in functionAppName functionAppHostname apiBaseUrl \
                     webAppName webAppHostname adminAppName adminAppHostname \
                     sqlServerName sqlServerFqdn sqlDatabaseName mediaHostname \
                     entraTenantId entraClientId entraAuthority; do
            value="$(echo "$outputs" | jq -er ".$key.value")"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

  database:
    # Everything the reference data set is made of, in both stores it lives in:
    # the icons in the media container, then the schema and the rows. All of it
    # before the API is published, so no version of the API ever executes
    # against a schema older than itself. The lifecycle belongs to /db and
    # /scripts — this job only calls their entry points.
    needs: infra
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: rg-lehub-${{ inputs.environment }}
      SQL_SERVER_NAME: ${{ needs.infra.outputs.sqlServerName }}
      SQL_SERVER_FQDN: ${{ needs.infra.outputs.sqlServerFqdn }}
      SQL_DATABASE_NAME: ${{ needs.infra.outputs.sqlDatabaseName }}
      FIREWALL_RULE: gh-${{ github.run_id }}
      # Pinned so a broken or renamed upstream release cannot break every
      # deployment with no change in this repository. Dependabot does not
      # track this — bumping it is a reviewed diff, like an action pin.
      SQLCMD_VERSION: v1.10.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install go-sqlcmd
        # The scripts use go-sqlcmd's --authentication-method, which the
        # ODBC sqlcmd preinstalled on the runner does not understand.
        run: |
          curl -fsSL -o /tmp/sqlcmd.tar.bz2 \
            "https://github.com/microsoft/go-sqlcmd/releases/download/${SQLCMD_VERSION}/sqlcmd-linux-amd64.tar.bz2"
          sudo tar -xjf /tmp/sqlcmd.tar.bz2 -C /usr/local/bin sqlcmd
          sqlcmd --version
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Upload the reference media
        # Before the rows, as scripts/dev-up.sh does locally: the paths db-seed.sh
        # writes are backed by real bytes from the first page load. Never --demo —
        # the script refuses it outside local anyway, so no placeholder can reach a
        # public environment. It resolves the media account from the resource group
        # itself and writes through the OIDC session, using the Storage Blob Data
        # Contributor assignment infra/modules/roleAssignments.bicep scopes to that
        # one account. No storage key exists on it to use instead.
        run: ./scripts/blob-seed.sh ${{ inputs.environment }}
      - name: Open the SQL firewall to this runner
        id: firewall
        # A GitHub runner's IP is unpredictable, so the rule is created for
        # this exact run and this exact address — never a permanent range,
        # never "allow Azure services". Orphaned rules from brutally
        # cancelled runs stay recognisable by their gh- prefix.
        run: |
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" \
            --name "$FIREWALL_RULE" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
            --output none
      - name: Wake the database
        # The dev database is serverless with auto-pause: the first
        # connection after a pause can time out while it resumes. This exact
        # case is retried — and only this one, the scripts themselves are
        # never replayed. The last attempt keeps its output, so an auth or
        # firewall problem reads as what it is, not as a wake-up timeout.
        run: |
          for attempt in 1 2 3 4; do
            if sqlcmd -S "$SQL_SERVER_FQDN" -d "$SQL_DATABASE_NAME" \
                 --authentication-method ActiveDirectoryAzCli \
                 -Q "SELECT 1" > /dev/null 2>&1; then
              exit 0
            fi
            echo "attempt $attempt: database not reachable yet, waiting 30s"
            sleep 30
          done
          echo "final attempt, with its real error if it fails:"
          sqlcmd -S "$SQL_SERVER_FQDN" -d "$SQL_DATABASE_NAME" \
            --authentication-method ActiveDirectoryAzCli \
            -Q "SELECT 1" > /dev/null
      - name: Apply pending migrations
        run: ./scripts/db-migrate.sh ${{ inputs.environment }}
      - name: Apply reference data
        # Never --demo: demonstration data does not enter an Azure
        # environment.
        #
        # BOOTSTRAP_ADMIN_EMAILS is a repository variable, not a secret: an
        # address is personal data, not a credential, and the seed only
        # registers it as pending. Unset, the step still succeeds and no
        # administrator is registered — see db/seed/admins.sql.
        env:
          LEHUB_BOOTSTRAP_ADMIN_EMAILS: ${{ vars.BOOTSTRAP_ADMIN_EMAILS }}
        run: ./scripts/db-seed.sh ${{ inputs.environment }}
      - name: Close the SQL firewall
        # Runs on failure too, but only if the rule could have been created —
        # otherwise a login failure would be followed by a spurious delete
        # error, and the noise would be what gets read first.
        if: ${{ always() && steps.firewall.outcome == 'success' }}
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" \
            --name "$FIREWALL_RULE"

  api:
    # Publishing has exactly one path: this job. No func publish from a
    # workstation — SCM and FTP credentials are disabled by Bicep anyway.
    needs: [infra, database]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Build
        working-directory: api
        run: |
          npm ci
          npm run build
      - name: Assemble the deployment artifact
        # Exactly dist/, host.json, package.json and production
        # node_modules — no devDependency, no TypeScript source.
        working-directory: api
        run: |
          npm ci --omit=dev
          mkdir publish
          cp -R dist host.json package.json node_modules publish/
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # App settings are owned by Bicep and their list is exhaustive: this
      # workflow writes none, or the next infra deployment would erase them.
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ needs.infra.outputs.functionAppName }}
          package: api/publish
          sku: flexconsumption
          remote-build: false
      - name: Check /api/health
        # A deployment that published successfully but does not answer is a
        # failure. Bounded retries absorb the cold start and a possible
        # database wake-up without looping forever.
        run: |
          url="https://${{ needs.infra.outputs.functionAppHostname }}/api/health"
          for attempt in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)"
            if [ "$code" = "200" ]; then
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: got $code, waiting 15s"
            sleep 15
          done
          echo "$url never answered 200" >&2
          exit 1

  web:
    # Both front-ends are built here with the real API URL of the target
    # environment: VITE_API_BASE_URL is baked in at build time, so a build
    # output is never transposable from one environment to another.
    needs: [infra, api]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      VITE_API_BASE_URL: ${{ needs.infra.outputs.apiBaseUrl }}
      # Le backoffice y renvoie : création de compte, et retour d'un compte sans
      # habilitation. C'est l'origine de la Static Web App publique.
      VITE_PUBLIC_SITE_URL: https://${{ needs.infra.outputs.webAppHostname }}
      # Et réciproquement : le menu compte du site public propose le portail de gestion
      # aux seuls comptes habilités (#137).
      VITE_ADMIN_BASE_URL: https://${{ needs.infra.outputs.adminAppHostname }}
      # Declared for the whole job because two steps need it: the one that writes it
      # into img-src before the upload, and the one that asserts it on the response
      # after it. A single declaration is what keeps the policy that gets published
      # and the policy that gets verified from drifting apart.
      MEDIA_HOSTNAME: ${{ needs.infra.outputs.mediaHostname }}
      # The identity tenant of the target environment, baked in like the API URL and for
      # the same reason: dev and prod are two different tenants, and a build carrying the
      # wrong one would let a test account reach production.
      VITE_ENTRA_TENANT_ID: ${{ needs.infra.outputs.entraTenantId }}
      VITE_ENTRA_CLIENT_ID: ${{ needs.infra.outputs.entraClientId }}
      VITE_ENTRA_AUTHORITY: ${{ needs.infra.outputs.entraAuthority }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/lehub.ms/package-lock.json
            frontend/admin.lehub.ms/package-lock.json
      - name: Refuse an empty build identifier
        # Every one of these is inlined at build time and unrecoverable afterwards. An
        # absent VITE_API_BASE_URL builds fine and produces a site that calls
        # undefined/...; an absent VITE_ENTRA_* one that opens a sign-in against
        # undefined and reports it as a network error. Fail here, loudly, instead.
        run: |
          status=0
          for name in VITE_API_BASE_URL VITE_PUBLIC_SITE_URL VITE_ADMIN_BASE_URL \
                      VITE_ENTRA_TENANT_ID VITE_ENTRA_CLIENT_ID VITE_ENTRA_AUTHORITY; do
            if [ -z "${!name}" ]; then
              echo "$name is empty — refusing to build a broken site" >&2
              status=1
            fi
          done
          exit $status
      # A failed build publishes nothing for either application: the publish
      # steps only run once both builds have succeeded.
      - name: Build the public app
        working-directory: frontend/lehub.ms
        run: |
          npm ci
          npm run build
      - name: Build the admin app
        working-directory: frontend/admin.lehub.ms
        run: |
          npm ci
          npm run build
      # The committed staticwebapp.config.json declares `img-src 'self' data:` and
      # `connect-src 'self'`, and stays that way: it has to remain a valid policy on its
      # own, and a fail-closed one. A build published outside this chain is then refused
      # by its own policy — no images, no API calls — instead of silently trusting every
      # host on a domain the whole platform shares. That is a visible failure, not a safe
      # one: `connect-src` carries the only fetch the bundle makes, so a `dist/` that
      # skipped this step renders empty pages. Both origins carry an environment-specific
      # name — a uniqueness hash on the media account, the environment's own Function App —
      # so neither can be written into a versioned file; they come from the deployment
      # outputs, like every other resource name here. No wildcard: `*.blob.core.windows.net`
      # or `*.azurewebsites.net` would allow any storage account or any Function App, an
      # attacker's included, which is the opposite of what the directives are for —
      # `connect-src` the more so, since it governs fetch and XHR, the most capable
      # exfiltration channel an injection can take.
      - name: Point both content security policies at this environment
        run: |
          if [ -z "$MEDIA_HOSTNAME" ]; then
            echo "mediaHostname is empty — refusing to publish a site that blocks its own images" >&2
            exit 1
          fi
          # VITE_API_BASE_URL is the job-level apiBaseUrl, already proven non-empty by the
          # step above and already carrying the scheme. Authorising the very value the
          # bundle calls is what keeps the policy and the fetch target from drifting apart.
          for cfg in frontend/lehub.ms/dist/staticwebapp.config.json \
                     frontend/admin.lehub.ms/dist/staticwebapp.config.json; do
            # Needles passed through --arg rather than interpolated into the jq program:
            # they contain the single quotes of 'self', which would otherwise have to
            # survive YAML, then shell, then jq.
            patched="$(jq \
              --arg img_needle  "img-src 'self' data:" \
              --arg img_repl    "img-src 'self' data: https://$MEDIA_HOSTNAME" \
              --arg conn_needle "connect-src 'self'" \
              --arg conn_repl   "connect-src 'self' $VITE_API_BASE_URL" \
              '.globalHeaders["Content-Security-Policy"]
                 |= (sub($img_needle; $img_repl) | sub($conn_needle; $conn_repl))' "$cfg")"
            # Asserted on each directive, not on the policy as one string: a needle that
            # stopped matching would leave its directive untouched, and a whole-string
            # test would still pass as soon as the origin appeared anywhere else in the
            # policy — publishing blocked images or refused API calls, silently, which is
            # precisely what this guard exists to catch. `first` on no match yields null,
            # which fails the containment check rather than passing it.
            printf '%s' "$patched" | jq -e \
              --arg media "https://$MEDIA_HOSTNAME" \
              --arg api   "$VITE_API_BASE_URL" \
              '.globalHeaders["Content-Security-Policy"] | split("; ")
                 | (map(select(startswith("img-src")))     | first | contains($media))
                   and
                   (map(select(startswith("connect-src"))) | first | contains($api))' > /dev/null
            printf '%s\n' "$patched" > "$cfg"
            echo "$cfg: img-src allows https://$MEDIA_HOSTNAME, connect-src allows $VITE_API_BASE_URL"
          done
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read the deployment tokens
        # Read at run time from the OIDC session, masked, never stored as a
        # GitHub secret.
        id: tokens
        run: |
          web_token="$(az staticwebapp secrets list \
            --name "${{ needs.infra.outputs.webAppName }}" \
            --query properties.apiKey --output tsv)"
          echo "::add-mask::$web_token"
          echo "web=$web_token" >> "$GITHUB_OUTPUT"
          admin_token="$(az staticwebapp secrets list \
            --name "${{ needs.infra.outputs.adminAppName }}" \
            --query properties.apiKey --output tsv)"
          echo "::add-mask::$admin_token"
          echo "admin=$admin_token" >> "$GITHUB_OUTPUT"
      # The two publications are independent: if the first fails, the second
      # still runs and the job stays red. skip_app_build ships the dist/
      # already built above — no Oryx rebuild on the Azure side. Each app's
      # staticwebapp.config.json travels inside dist/, copied from public/.
      - name: Publish the public app
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.tokens.outputs.web }}
          action: upload
          app_location: frontend/lehub.ms/dist
          skip_app_build: true
          skip_api_build: true
      - name: Publish the admin app
        if: ${{ !cancelled() && steps.tokens.outcome == 'success' }}
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.tokens.outputs.admin }}
          action: upload
          app_location: frontend/admin.lehub.ms/dist
          skip_app_build: true
          skip_api_build: true
      - name: Check both sites answer with this environment's headers
        # A 200 on / proves the site is up, not that it serves the policy this job
        # just wrote. A configuration uploaded but never applied, a publication that
        # changed nothing and left the previous deployment serving, a dist/ published
        # outside this chain and so never patched at all: each of them keeps
        # answering 200 while serving someone else's headers, or none. And because
        # connect-src now carries the only fetch the bundles make, the visible result
        # is empty pages behind a green job. The guard before the upload can only see
        # the file on the runner; what a browser obeys is the response, so that is
        # what is asserted here. It extends the existing retry loop instead of
        # standing as its own step: Static Web Apps propagates a publication in its
        # own time, and a single request fired straight after the upload would race
        # that propagation and fail a healthy deployment.
        run: |
          # HTTP/2 lower-cases every header name, so the name is matched folded. The
          # status line carries no colon and therefore matches nothing.
          header_of() {
            tr -d '\r' < "$1" | awk -v want="$2" '
              tolower(substr($0, 1, index($0, ":") - 1)) == want {
                sub(/^[^:]*:[[:space:]]*/, ""); print; exit
              }'
          }
          # Read one directive at a time, as the guard before the upload does: testing
          # the policy as a single string would pass as soon as an origin turned up in
          # any other directive. A directive that is absent — or a policy that is —
          # yields the empty string, which contains neither origin and so fails.
          directive_of() {
            printf '%s\n' "$1" | tr ';' '\n' \
              | awk -v want="$2" '{ $1 = $1 } $1 == want { print; exit }'
          }
          note() { problem="${problem:+$problem; }$1"; }

          # This step is the last thing standing between a policy that never took
          # effect and a green pipeline, so it does not inherit its own preconditions
          # from the steps that ran before it. An empty needle would turn every
          # containment test below into a match-anything and pronounce a site serving
          # no policy at all conformant — the one outcome this step exists to prevent.
          if [ -z "$MEDIA_HOSTNAME" ] || [ -z "$VITE_API_BASE_URL" ]; then
            echo "media hostname or API URL is empty — there is nothing to assert against" >&2
            exit 1
          fi

          media_origin="https://$MEDIA_HOSTNAME"
          headers="$(mktemp)"
          failed=""
          # Indexing is asserted in both directions. noindex protects the backoffice;
          # its absence on the public application is just as much a requirement, since
          # a header leaking from one configuration into the other would deindex the
          # very site the project exists to publish.
          for target in "${{ needs.infra.outputs.webAppHostname }} indexable" \
                        "${{ needs.infra.outputs.adminAppHostname }} noindex"; do
            host="${target% *}"
            indexing="${target##* }"
            # Ten attempts fifteen seconds apart, the budget the API health probe
            # already uses: this waits on a configuration reaching the edge, not just
            # on a process accepting connections, and the old forty-second window was
            # sized for the latter. Failing a healthy deployment would teach the
            # pipeline's readers to replay the job rather than believe it.
            for attempt in $(seq 1 10); do
              problem=""
              : > "$headers"
              # A distinct query per attempt. The sites answer max-age=30, so
              # requesting one unchanging URL every fifteen seconds can be served the
              # pre-publication response out of a cache for the whole window — the
              # probe would then assert the deployment it was meant to replace. The
              # path is untouched, so the same configuration governs the answer.
              code="$(curl -s -o /dev/null -D "$headers" -w '%{http_code}' --max-time 30 \
                "https://$host/?cd=${GITHUB_RUN_ID}-$attempt" || true)"
              csp="$(header_of "$headers" content-security-policy)"
              robots="$(header_of "$headers" x-robots-tag)"
              if [ "$code" != "200" ]; then
                note "answered $code"
              else
                case "$(directive_of "$csp" img-src)" in
                  *"$media_origin"*) ;;
                  *) note "img-src does not allow $media_origin" ;;
                esac
                case "$(directive_of "$csp" connect-src)" in
                  *"$VITE_API_BASE_URL"*) ;;
                  *) note "connect-src does not allow $VITE_API_BASE_URL" ;;
                esac
                # Containment, like the directives above, and for the same reason:
                # the expectation is deliberately not read back from the file that
                # was uploaded — an artefact whose patch silently failed would then
                # agree with itself and pass — but an independent expectation must
                # not turn every legitimate addition to the header, noarchive say,
                # into a red pipeline discovered only after the merge.
                if [ "$indexing" = noindex ]; then
                  for token in noindex nofollow; do
                    case "$robots" in
                      *"$token"*) ;;
                      *) note "X-Robots-Tag is '${robots:-absent}', missing $token" ;;
                    esac
                  done
                fi
                if [ "$indexing" = indexable ] && [ -n "$robots" ]; then
                  note "X-Robots-Tag is '$robots' on a site that has to stay indexable"
                fi
              fi
              if [ -z "$problem" ]; then
                echo "https://$host/ answers 200 with this environment's headers"
                continue 2
              fi
              echo "attempt $attempt on $host: $problem, waiting 15s"
              sleep 15
            done
            # The whole served policy, not just the failing directive: when nothing
            # was applied at all, seeing the committed 'self'-only policy come back
            # names the cause immediately.
            echo "https://$host/ never served this environment's headers: $problem" >&2
            echo "  Content-Security-Policy: ${csp:-absent}" >&2
            echo "  X-Robots-Tag: ${robots:-absent}" >&2
            failed=1
          done
          # Both hostnames are probed before the job gives up. A rewrite gone wrong
          # affects both applications, and stopping at the first would hide the
          # backoffice behind the public site — including the one assertion only the
          # backoffice carries.
          [ -z "$failed" ] || exit 1
