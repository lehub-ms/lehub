name: CD

# The deployment pipeline, parameterised by environment and owning no trigger
# of its own. cd-dev.yml calls it for dev on every merge to develop; opening
# prod one day is a new ten-line caller plus its identity bootstrap — a
# configuration to add, not a workflow to rewrite.
#
# Job order is the order the architecture imposes: resources first, then the
# database schema, then the API, then the two web apps — which need the
# Function App's public URL at build time.
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prod)
        required: true
        type: string

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    # The GitHub environment carries the AZURE_* variables and is what the
    # federated credential's subject points at: no environment, no token.
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      functionAppName: ${{ steps.deploy.outputs.functionAppName }}
      functionAppHostname: ${{ steps.deploy.outputs.functionAppHostname }}
      apiBaseUrl: ${{ steps.deploy.outputs.apiBaseUrl }}
      webAppName: ${{ steps.deploy.outputs.webAppName }}
      webAppHostname: ${{ steps.deploy.outputs.webAppHostname }}
      adminAppName: ${{ steps.deploy.outputs.adminAppName }}
      adminAppHostname: ${{ steps.deploy.outputs.adminAppHostname }}
      sqlServerName: ${{ steps.deploy.outputs.sqlServerName }}
      sqlServerFqdn: ${{ steps.deploy.outputs.sqlServerFqdn }}
      sqlDatabaseName: ${{ steps.deploy.outputs.sqlDatabaseName }}
      mediaHostname: ${{ steps.deploy.outputs.mediaHostname }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infra/main.bicep
        id: deploy
        # Named after the run so the portal's deployment history links back to
        # the GitHub execution that produced it. The resource group is a
        # prerequisite created by hand — see docs/deployment.md.
        run: |
          outputs=$(az deployment group create \
            --resource-group "rg-lehub-${{ inputs.environment }}" \
            --name "lehub-${{ github.run_id }}" \
            --template-file infra/main.bicep \
            --parameters "infra/main.${{ inputs.environment }}.bicepparam" \
            --query properties.outputs --output json)
          # Every downstream job consumes resource names from here — never a
          # hard-coded name in any workflow. Assign before appending: a
          # failed substitution in an echo argument would not fail the step,
          # a failed assignment does.
          for key in functionAppName functionAppHostname apiBaseUrl \
                     webAppName webAppHostname adminAppName adminAppHostname \
                     sqlServerName sqlServerFqdn sqlDatabaseName mediaHostname; do
            value="$(echo "$outputs" | jq -er ".$key.value")"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

  database:
    # Migrations and reference data run before the API is published, so no
    # version of the API ever executes against a schema older than itself.
    # The schema lifecycle belongs to /db and /scripts — this job only calls
    # them.
    needs: infra
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: rg-lehub-${{ inputs.environment }}
      SQL_SERVER_NAME: ${{ needs.infra.outputs.sqlServerName }}
      SQL_SERVER_FQDN: ${{ needs.infra.outputs.sqlServerFqdn }}
      SQL_DATABASE_NAME: ${{ needs.infra.outputs.sqlDatabaseName }}
      FIREWALL_RULE: gh-${{ github.run_id }}
      # Pinned so a broken or renamed upstream release cannot break every
      # deployment with no change in this repository. Dependabot does not
      # track this — bumping it is a reviewed diff, like an action pin.
      SQLCMD_VERSION: v1.10.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install go-sqlcmd
        # The scripts use go-sqlcmd's --authentication-method, which the
        # ODBC sqlcmd preinstalled on the runner does not understand.
        run: |
          curl -fsSL -o /tmp/sqlcmd.tar.bz2 \
            "https://github.com/microsoft/go-sqlcmd/releases/download/${SQLCMD_VERSION}/sqlcmd-linux-amd64.tar.bz2"
          sudo tar -xjf /tmp/sqlcmd.tar.bz2 -C /usr/local/bin sqlcmd
          sqlcmd --version
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Open the SQL firewall to this runner
        id: firewall
        # A GitHub runner's IP is unpredictable, so the rule is created for
        # this exact run and this exact address — never a permanent range,
        # never "allow Azure services". Orphaned rules from brutally
        # cancelled runs stay recognisable by their gh- prefix.
        run: |
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" \
            --name "$FIREWALL_RULE" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
            --output none
      - name: Wake the database
        # The dev database is serverless with auto-pause: the first
        # connection after a pause can time out while it resumes. This exact
        # case is retried — and only this one, the scripts themselves are
        # never replayed. The last attempt keeps its output, so an auth or
        # firewall problem reads as what it is, not as a wake-up timeout.
        run: |
          for attempt in 1 2 3 4; do
            if sqlcmd -S "$SQL_SERVER_FQDN" -d "$SQL_DATABASE_NAME" \
                 --authentication-method ActiveDirectoryAzCli \
                 -Q "SELECT 1" > /dev/null 2>&1; then
              exit 0
            fi
            echo "attempt $attempt: database not reachable yet, waiting 30s"
            sleep 30
          done
          echo "final attempt, with its real error if it fails:"
          sqlcmd -S "$SQL_SERVER_FQDN" -d "$SQL_DATABASE_NAME" \
            --authentication-method ActiveDirectoryAzCli \
            -Q "SELECT 1" > /dev/null
      - name: Apply pending migrations
        run: ./scripts/db-migrate.sh ${{ inputs.environment }}
      - name: Apply reference data
        # Never --demo: demonstration data does not enter an Azure
        # environment.
        run: ./scripts/db-seed.sh ${{ inputs.environment }}
      - name: Close the SQL firewall
        # Runs on failure too, but only if the rule could have been created —
        # otherwise a login failure would be followed by a spurious delete
        # error, and the noise would be what gets read first.
        if: ${{ always() && steps.firewall.outcome == 'success' }}
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" \
            --name "$FIREWALL_RULE"

  api:
    # Publishing has exactly one path: this job. No func publish from a
    # workstation — SCM and FTP credentials are disabled by Bicep anyway.
    needs: [infra, database]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Build
        working-directory: api
        run: |
          npm ci
          npm run build
      - name: Assemble the deployment artifact
        # Exactly dist/, host.json, package.json and production
        # node_modules — no devDependency, no TypeScript source.
        working-directory: api
        run: |
          npm ci --omit=dev
          mkdir publish
          cp -R dist host.json package.json node_modules publish/
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # App settings are owned by Bicep and their list is exhaustive: this
      # workflow writes none, or the next infra deployment would erase them.
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ needs.infra.outputs.functionAppName }}
          package: api/publish
          sku: flexconsumption
          remote-build: false
      - name: Check /api/health
        # A deployment that published successfully but does not answer is a
        # failure. Bounded retries absorb the cold start and a possible
        # database wake-up without looping forever.
        run: |
          url="https://${{ needs.infra.outputs.functionAppHostname }}/api/health"
          for attempt in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)"
            if [ "$code" = "200" ]; then
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: got $code, waiting 15s"
            sleep 15
          done
          echo "$url never answered 200" >&2
          exit 1

  web:
    # Both front-ends are built here with the real API URL of the target
    # environment: VITE_API_BASE_URL is baked in at build time, so a build
    # output is never transposable from one environment to another.
    needs: [infra, api]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      VITE_API_BASE_URL: ${{ needs.infra.outputs.apiBaseUrl }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/lehub.ms/package-lock.json
            frontend/admin.lehub.ms/package-lock.json
      - name: Refuse an empty API URL
        # An absent VITE_API_BASE_URL builds fine and produces a site that
        # calls undefined/... — fail here, loudly, instead.
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL is empty — refusing to build a broken site" >&2
            exit 1
          fi
      # A failed build publishes nothing for either application: the publish
      # steps only run once both builds have succeeded.
      - name: Build the public app
        working-directory: frontend/lehub.ms
        run: |
          npm ci
          npm run build
      - name: Build the admin app
        working-directory: frontend/admin.lehub.ms
        run: |
          npm ci
          npm run build
      # The committed staticwebapp.config.json declares `img-src 'self' data:` and stays
      # that way: it has to remain a valid policy on its own, so a build outside this
      # chain produces a site that blocks images rather than a broken site. The media
      # account's host carries a uniqueness hash and differs per environment, so it
      # cannot be written into a versioned file — it comes from the deployment outputs,
      # like every other resource name here. No wildcard: `*.blob.core.windows.net`
      # would allow any storage account, an attacker's included, which is the opposite
      # of what the directive is for.
      - name: Allow the media account in both content security policies
        env:
          MEDIA_HOSTNAME: ${{ needs.infra.outputs.mediaHostname }}
        run: |
          if [ -z "$MEDIA_HOSTNAME" ]; then
            echo "mediaHostname is empty — refusing to publish a site that blocks its own images" >&2
            exit 1
          fi
          # Passed through --arg rather than interpolated into the jq program: the needle
          # contains the single quotes of 'self', which would otherwise have to survive
          # YAML, then shell, then jq.
          for cfg in frontend/lehub.ms/dist/staticwebapp.config.json \
                     frontend/admin.lehub.ms/dist/staticwebapp.config.json; do
            patched="$(jq \
              --arg needle "img-src 'self' data:" \
              --arg repl   "img-src 'self' data: https://$MEDIA_HOSTNAME" \
              '.globalHeaders["Content-Security-Policy"] |= sub($needle; $repl)' "$cfg")"
            # A renamed or reworded directive would leave the policy untouched and publish
            # a site whose images are blocked, silently. Fail here instead.
            printf '%s' "$patched" | jq -e \
              --arg origin "https://$MEDIA_HOSTNAME" \
              '.globalHeaders["Content-Security-Policy"] | contains($origin)' > /dev/null
            printf '%s\n' "$patched" > "$cfg"
            echo "$cfg: img-src now allows https://$MEDIA_HOSTNAME"
          done
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read the deployment tokens
        # Read at run time from the OIDC session, masked, never stored as a
        # GitHub secret.
        id: tokens
        run: |
          web_token="$(az staticwebapp secrets list \
            --name "${{ needs.infra.outputs.webAppName }}" \
            --query properties.apiKey --output tsv)"
          echo "::add-mask::$web_token"
          echo "web=$web_token" >> "$GITHUB_OUTPUT"
          admin_token="$(az staticwebapp secrets list \
            --name "${{ needs.infra.outputs.adminAppName }}" \
            --query properties.apiKey --output tsv)"
          echo "::add-mask::$admin_token"
          echo "admin=$admin_token" >> "$GITHUB_OUTPUT"
      # The two publications are independent: if the first fails, the second
      # still runs and the job stays red. skip_app_build ships the dist/
      # already built above — no Oryx rebuild on the Azure side. Each app's
      # staticwebapp.config.json travels inside dist/, copied from public/.
      - name: Publish the public app
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.tokens.outputs.web }}
          action: upload
          app_location: frontend/lehub.ms/dist
          skip_app_build: true
          skip_api_build: true
      - name: Publish the admin app
        if: ${{ !cancelled() && steps.tokens.outcome == 'success' }}
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.tokens.outputs.admin }}
          action: upload
          app_location: frontend/admin.lehub.ms/dist
          skip_app_build: true
          skip_api_build: true
      - name: Check both sites answer
        run: |
          for host in "${{ needs.infra.outputs.webAppHostname }}" \
                      "${{ needs.infra.outputs.adminAppHostname }}"; do
            for attempt in $(seq 1 5); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$host/" || true)"
              if [ "$code" = "200" ]; then
                echo "https://$host/ answers 200"
                continue 2
              fi
              echo "attempt $attempt on $host: got $code, waiting 10s"
              sleep 10
            done
            echo "https://$host/ never answered 200" >&2
            exit 1
          done
